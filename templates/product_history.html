{% extends "base.html" %}
{% block title %}History Search - SmartStock{% endblock %}
{% block content %}
<div class="row mb-5">
    <div class="col-12">
        <h1 class="display-5 fw-bold mb-1"><i class="fas fa-history text-warning"></i> Product History</h1>
        <p class="text-muted mb-4">🔍 Type to auto-filter Cities → Stores → Products</p>
    </div>
</div>

<!-- 🔥 AUTOCOMPLETE SEARCH -->
<div class="row mb-5">
    <div class="col-md-10 mx-auto">
        <div class="card glass-card shadow-lg">
            <div class="card-body p-4">
                <form id="historySearchForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label fw-bold">📅 Date From</label>
                            <input type="date" class="form-control glass-input" name="date_from" id="date_from">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">📅 Date To</label>
                            <input type="date" class="form-control glass-input" name="date_to" id="date_to">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">🏙️ City</label>
                            <div class="dropdown position-relative">
                                <input type="text" class="form-control glass-input" id="city_input" placeholder="Type city...">
                                <input type="hidden" name="city" id="city_value">
                                <ul class="dropdown-menu w-100 shadow position-absolute" id="city_dropdown" style="max-height: 200px; overflow-y: auto; display: none;"></ul>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">🏪 Store</label>
                            <div class="dropdown position-relative">
                                <input type="text" class="form-control glass-input" id="store_input" placeholder="Select city first..." disabled>
                                <input type="hidden" name="storeid" id="store_value">
                                <ul class="dropdown-menu w-100 shadow position-absolute" id="store_dropdown" style="max-height: 200px; overflow-y: auto; display: none;"></ul>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">📦 Product</label>
                            <div class="dropdown position-relative">
                                <input type="text" class="form-control glass-input" id="product_input" placeholder="Select store first..." disabled>
                                <input type="hidden" name="product" id="product_value">
                                <ul class="dropdown-menu w-100 shadow position-absolute" id="product_dropdown" style="max-height: 200px; overflow-y: auto; display: none;"></ul>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col-12 text-center">
                            <button type="submit" class="btn glass-btn btn-lg px-5" disabled id="search_btn">
                                <i class="fas fa-search me-2"></i>🔍 SEARCH HISTORY
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- RESULTS -->
<div class="row">
    <div class="col-12">
        <div class="card glass-card shadow-lg">
            <div class="card-header bg-warning text-dark">
                <h5 id="resultsHeader">📊 Historical Records (<span id="resultsCount">0</span>)</h5>
            </div>
            <div class="card-body p-0">
                <div id="resultsTable" class="table-responsive">
                    <p class="text-center py-5 text-muted">🔍 Select City → Store → Product → SEARCH</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let cities = [], stores = [], products = [];

// 🔥 CITY AUTOCOMPLETE
document.getElementById('city_input').addEventListener('input', async function() {
    const query = this.value.toLowerCase();
    if (query.length < 1) {
        document.getElementById('city_dropdown').style.display = 'none';
        return;
    }
    
    const response = await fetch(`/api/cities?search=${query}`);
    cities = await response.json();
    
    const dropdown = document.getElementById('city_dropdown');
    dropdown.innerHTML = cities.map(city => 
        `<li><a class="dropdown-item" href="#" onclick="selectCity('${city.cityname}')">${city.cityname} (${city.store_count} stores)</a></li>`
    ).join('');
    dropdown.style.display = 'block';
});

// 🔥 STORE AUTOCOMPLETE (loads after city)
async function selectCity(cityname) {
    document.getElementById('city_input').value = cityname;
    document.getElementById('city_value').value = cityname;
    document.getElementById('city_dropdown').style.display = 'none';
    
    // Load stores for this city
    document.getElementById('store_input').disabled = false;
    const response = await fetch(`/api/stores-by-city?city=${encodeURIComponent(cityname)}`);
    stores = await response.json();
    document.getElementById('store_input').placeholder = `Type store in ${cityname}...`;
}

// 🔥 STORE AUTOCOMPLETE
document.getElementById('store_input').addEventListener('input', async function() {
    const query = this.value.toLowerCase();
    if (query.length < 1 || stores.length === 0) return;
    
    const dropdown = document.getElementById('store_dropdown');
    const filtered = stores.filter(store => store.storename.toLowerCase().includes(query));
    
    dropdown.innerHTML = filtered.map(store => 
        `<li><a class="dropdown-item" href="#" onclick="selectStore(${store.storeid}, '${store.storename}')">${store.storename}</a></li>`
    ).join('');
    dropdown.style.display = filtered.length > 0 ? 'block' : 'none';
});

async function selectStore(storeid, storename) {
    document.getElementById('store_input').value = storename;
    document.getElementById('store_value').value = storeid;
    document.getElementById('store_dropdown').style.display = 'none';
    
    // Load products for this store
    document.getElementById('product_input').disabled = false;
    const response = await fetch(`/api/store-products?storeid=${storeid}`);
    products = await response.json();
    document.getElementById('product_input').placeholder = `Type product in ${storename}...`;
    updateSearchButton();
}

// 🔥 PRODUCT AUTOCOMPLETE
document.getElementById('product_input').addEventListener('input', function() {
    const query = this.value.toLowerCase();
    if (query.length < 1 || products.length === 0) return;
    
    const dropdown = document.getElementById('product_dropdown');
    const filtered = products.filter(product => product.productname.toLowerCase().includes(query));
    
    dropdown.innerHTML = filtered.map(product => 
        `<li><a class="dropdown-item" href="#" onclick="selectProduct('${product.productname}')">${product.productname}</a></li>`
    ).join('');
    dropdown.style.display = filtered.length > 0 ? 'block' : 'none';
});

function selectProduct(productname) {
    document.getElementById('product_input').value = productname;
    document.getElementById('product_value').value = productname;
    document.getElementById('product_dropdown').style.display = 'none';
    updateSearchButton();
}

function updateSearchButton() {
    const city = document.getElementById('city_value').value;
    const store = document.getElementById('store_value').value;
    const product = document.getElementById('product_value').value;
    document.getElementById('search_btn').disabled = !(city && store && product);
}

// Hide dropdowns on outside click
document.addEventListener('click', function(e) {
    if (!e.target.closest('.dropdown')) {
        document.querySelectorAll('.dropdown-menu').forEach(d => d.style.display = 'none');
    }
});

// 🔥 SEARCH
document.getElementById('historySearchForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const params = new URLSearchParams(formData);
    const response = await fetch(`/api/history-search?${params}`);
    // ... (same results code as before)
});
</script>
{% endblock %}
