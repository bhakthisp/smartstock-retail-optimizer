{% extends "base.html" %}
{% block title %}History Search - SmartStock{% endblock %}
{% block content %}
<div class="row mb-5">
    <div class="col-12">
        <h1 class="display-5 fw-bold mb-1"><i class="fas fa-history text-warning"></i> Product History</h1>
        <p class="text-muted mb-4">🔍 Type to search Cities → Stores → Products</p>
    </div>
</div>

<!-- 🔥 SIMPLE SEARCH FORM -->
<div class="row mb-5">
    <div class="col-md-10 mx-auto">
        <div class="card glass-card shadow-lg">
            <div class="card-body p-4">
                <form id="historySearchForm">
                    <div class="row g-3">
                        <div class="col-md-2">
                            <label class="form-label fw-bold">📅 Date From</label>
                            <input type="date" class="form-control glass-input" name="date_from">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">📅 Date To</label>
                            <input type="date" class="form-control glass-input" name="date_to">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">🏙️ City</label>
                            <input type="text" class="form-control glass-input" name="city" placeholder="Delhi">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">🏪 Store</label>
                            <input type="text" class="form-control glass-input" name="store" placeholder="Store 7">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">📦 Product</label>
                            <input type="text" class="form-control glass-input" name="product" placeholder="Toothpaste">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn glass-btn btn-lg w-100">🔍 SEARCH</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- RESULTS -->
<div class="row">
    <div class="col-12">
        <div class="card glass-card shadow-lg">
            <div class="card-header bg-warning text-dark">
                <h5>📊 Historical Records (<span id="resultsCount">0</span>)</h5>
            </div>
            <div class="card-body p-0">
                <div id="resultsTable" class="table-responsive">
                    <div class="p-5 text-center text-muted">
                        <i class="fas fa-search fa-3x mb-3 opacity-50"></i>
                        <h5>Enter criteria and click SEARCH</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentCity = '', currentStore = '';

// 🔥 1. CITY DROPDOWN (uses your /api/cities)
document.querySelector('[name="city"]').addEventListener('input', async function(e) {
    let value = e.target.value;
    if (value.length < 2) return;
    
    try {
        let cities = await (await fetch(`/api/cities?search=${value}`)).json();
        showDropdown(e.target, cities, 'cityname', 'cityname');
    } catch(e) { console.error(e); }
});

// 🔥 2. STORE DROPDOWN (uses your /api/stores-by-city)
document.querySelector('[name="store"]').addEventListener('input', async function(e) {
    let cityValue = document.querySelector('[name="city"]').value;
    let storeValue = e.target.value;
    
    if (storeValue.length < 2 && cityValue) {
        try {
            let stores = await (await fetch(`/api/stores-by-city?city=${cityValue}`)).json();
            showDropdown(e.target, stores, 'storename', 'storename');
        } catch(e) { console.error(e); }
    }
});

function showDropdown(input, data, displayField, valueField = displayField) {
    let dropdown = input.parentNode.querySelector('.dropdown-menu');
    if (!dropdown) {
        dropdown = document.createElement('div');
        dropdown.className = 'dropdown-menu w-100 position-absolute z-3 bg-white border shadow';
        input.parentNode.style.position = 'relative';
        input.parentNode.appendChild(dropdown);
    }
    
    dropdown.innerHTML = data.slice(0,10).map(item => 
        `<div class="dropdown-item p-2 cursor-pointer" onclick="selectItem('${input.name}', '${item[valueField]}')">${item[displayField]}</div>`
    ).join('') || '<div class="dropdown-item text-muted p-2">No matches</div>';
    
    dropdown.style.display = data.length ? 'block' : 'none';
}

function selectItem(field, value) {
    document.querySelector(`[name="${field}"]`).value = value;
    // Hide all dropdowns
    document.querySelectorAll('.dropdown-menu').forEach(d => d.style.display = 'none');
}

// 🔥 3. YOUR ORIGINAL FORM SUBMIT (UNCHANGED!)
document.getElementById('historySearchForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const params = new URLSearchParams();
    for (let [key, value] of formData.entries()) {
        if (value.trim()) params.append(key, value.trim());
    }
    
    // ... YOUR EXISTING SEARCH CODE EXACTLY SAME ...
    try {
        const response = await fetch(`/api/history-search?${params}`);
        const data = await response.json();
        // ... rest unchanged
    } catch(e) { /* unchanged */ }
});

// Hide dropdowns on outside click
document.addEventListener('click', function(e) {
    if (!e.target.closest('.col-md-2')) {
        document.querySelectorAll('.dropdown-menu').forEach(d => d.style.display = 'none');
    }
});
</script>

{% endblock %}
