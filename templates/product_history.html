{% extends "base.html" %}
{% block title %}History Search - SmartStock{% endblock %}
{% block content %}
<div class="row mb-5">
    <div class="col-12">
        <h1 class="display-5 fw-bold mb-1"><i class="fas fa-history text-warning"></i> Product History</h1>
        <p class="text-muted mb-4">🔍 Search by City → Store (Admin Only)</p>
    </div>
</div>

<!-- 🔥 CITY + STORE ONLY SEARCH FORM -->
<div class="row mb-5">
    <div class="col-md-10 mx-auto">
        <div class="card glass-card shadow-lg">
            <div class="card-body p-4">
                <form id="historySearchForm">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">🏙️ City</label>
                            <input type="text" class="form-control glass-input" name="city" value="{{ city_filter or '' }}" placeholder="e.g. Mumbai">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">🏪 Store</label>
                            <input type="text" class="form-control glass-input" name="store" value="{{ store_filter or '' }}" placeholder="e.g. Demo Store">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn glass-btn btn-lg w-100" id="search_btn">
                                🔍 SEARCH
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- RESULTS -->
<div class="row">
    <div class="col-12">
        <div class="card glass-card shadow-lg">
            <div class="card-header bg-warning text-dark">
                <h5>📊 Historical Records (<span id="resultsCount">0</span>)</h5>
            </div>
            <div class="card-body p-0">
                <div id="resultsTable" class="table-responsive">
                    <div class="p-5 text-center text-muted">
                        <i class="fas fa-search fa-3x mb-3 opacity-50"></i>
                        <h5>Enter City/Store and click SEARCH</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('historySearchForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const params = new URLSearchParams();
    for (let [key, value] of formData.entries()) {
        if (value.trim()) params.append(key, value.trim());
    }
    
    try {
        document.getElementById('search_btn').innerHTML = '⏳ Searching...';
        
        const response = await fetch(`/api/history-search?${params}`);
        const data = await response.json();
        
        document.getElementById('resultsCount').textContent = data.length || 0;
        
        if (data.error) {
            document.getElementById('resultsTable').innerHTML = 
                `<div class="alert alert-danger p-5 m-0"><h5>❌ ${data.error}</h5></div>`;
            return;
        }
        
        if (!data.length) {
            document.getElementById('resultsTable').innerHTML = 
                `<div class="p-5 text-center text-muted m-0"><h5>📭 No records found for this City/Store</h5></div>`;
            return;
        }
        
        let html = `
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>City</th>
                        <th>Store</th>
                        <th>Product</th>
                        <th>Stock</th>
                        <th>Sales</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
        `;
        
        data.forEach(row => {
            const statusClass = row.stock_status?.includes('Low') ? 'text-danger' : 
                               row.stock_status?.includes('Overstock') ? 'text-warning' : 'text-success';
            html += `
                <tr>
                    <td>${row.timestamp ? new Date(row.timestamp).toLocaleDateString() : 'N/A'}</td>
                    <td><span class="badge bg-info">${row.city_name || row.cityname || 'N/A'}</span></td>
                    <td>${row.store_name || row.storename || 'N/A'}</td>
                    <td>${row.product_name || row.productname || 'N/A'}</td>
                    <td><strong class="${statusClass}">${row.stock || 0}</strong></td>
                    <td>${row.sale_amount || row.saleamount || 0}</td>
                    <td>
                        <span class="badge ${
                            statusClass === 'text-danger' ? 'bg-danger' : 
                            statusClass === 'text-warning' ? 'bg-warning text-dark' : 'bg-success'
                        }">
                            ${row.stock_status || 'OK'}
                        </span>
                    </td>
                </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('resultsTable').innerHTML = html;
        document.getElementById('search_btn').innerHTML = '✅ REFRESH';
        
    } catch(e) {
        console.error('Search failed:', e);
        document.getElementById('resultsTable').innerHTML = 
            `<div class="alert alert-danger p-5 m-0"><h5>❌ Search failed: ${e.message}</h5></div>`;
        document.getElementById('search_btn').innerHTML = '🔍 SEARCH';
    }
});
</script>
{% endblock %}
