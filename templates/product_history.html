{% extends "base.html" %}
{% block title %}History Search - SmartStock{% endblock %}
{% block content %}
<div class="row mb-5">
    <div class="col-12">
        <h1 class="display-5 fw-bold mb-1"><i class="fas fa-history text-warning"></i> Product History</h1>
        <p class="text-muted mb-4">🔍 Type to auto-filter Cities → Stores → Products</p>
    </div>
</div>

<!-- 🔥 AUTOCOMPLETE FORM -->
<div class="row mb-5">
    <div class="col-md-10 mx-auto">
        <div class="card glass-card shadow-lg">
            <div class="card-body p-4">
                <form id="historySearchForm">
                    <div class="row g-3">
                        <div class="col-md-2">
                            <label class="form-label fw-bold">📅 Date From</label>
                            <input type="date" class="form-control glass-input" name="date_from" id="date_from">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">📅 Date To</label>
                            <input type="date" class="form-control glass-input" name="date_to" id="date_to">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">🏙️ City</label>
                            <div class="position-relative">
                                <input type="text" class="form-control glass-input" id="city_input" placeholder="Type 'm'...">
                                <input type="hidden" name="city" id="city_value">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">🏪 Store</label>
                            <div class="position-relative">
                                <input type="text" class="form-control glass-input" id="store_input" placeholder="Select city..." disabled>
                                <input type="hidden" name="store" id="store_value">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">📦 Product</label>
                            <div class="position-relative">
                                <input type="text" class="form-control glass-input" id="product_input" placeholder="Select store..." disabled>
                                <input type="hidden" name="product" id="product_value">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn glass-btn btn-lg w-100" id="search_btn" disabled>🔍 SEARCH</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- RESULTS -->
<div class="row">
    <div class="col-12">
        <div class="card glass-card shadow-lg">
            <div class="card-header bg-warning text-dark">
                <h5>📊 Historical Records (<span id="resultsCount">0</span>)</h5>
            </div>
            <div class="card-body p-0">
                <div id="resultsTable" class="table-responsive">
                    <div class="p-5 text-center text-muted">
                        <i class="fas fa-search fa-3x mb-3 opacity-50"></i>
                        <h5>Type city → store → product → SEARCH</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let cities = [], stores = [], products = [];

// 🔥 CITY AUTOCOMPLETE
document.getElementById('city_input').addEventListener('input', async function() {
    const query = this.value.trim();
    if (query.length < 1) return;
    
    try {
        const response = await fetch(`/api/cities?search=${encodeURIComponent(query)}`);
        cities = await response.json();
        
        showDropdown('city_dropdown', cities.map(c => 
            `<li class="dropdown-item p-2" onclick="selectCity('${c.cityname}')">${c.cityname} (${c.store_count} stores)</li>`
        ).join(''));
    } catch(e) {
        console.error('City search failed:', e);
    }
});

function showDropdown(id, html) {
    let dropdown = document.getElementById(id);
    if (!dropdown) {
        dropdown = document.createElement('ul');
        dropdown.id = id;
        dropdown.className = 'list-group position-absolute w-100 shadow mt-1 z-3 bg-white rounded';
        dropdown.style.display = 'none';
        dropdown.style.maxHeight = '200px';
        dropdown.style.overflowY = 'auto';
        dropdown.parentNode.style.position = 'relative';
        dropdown.parentNode.appendChild(dropdown);
    }
    dropdown.innerHTML = html;
    dropdown.style.display = html ? 'block' : 'none';
}

function selectCity(cityname) {
    document.getElementById('city_input').value = cityname;
    document.getElementById('city_value').value = cityname;
    document.getElementById('city_dropdown').style.display = 'none';
    document.getElementById('store_input').disabled = false;
    document.getElementById('store_input').placeholder = `Stores in ${cityname}...`;
    updateSearchButton();
}

// 🔥 STORE AUTOCOMPLETE
document.getElementById('store_input').addEventListener('input', async function() {
    const query = this.value.trim();
    const city = document.getElementById('city_value').value;
    if (query.length < 1 || !city) return;
    
    try {
        const response = await fetch(`/api/stores-by-city?city=${encodeURIComponent(city)}`);
        stores = await response.json();
        const filtered = stores.filter(s => s.storename.toLowerCase().includes(query.toLowerCase()));
        
        showDropdown('store_dropdown', filtered.map(s => 
            `<li class="dropdown-item p-2" onclick="selectStore('${s.storename}')">${s.storename}</li>`
        ).join(''));
    } catch(e) {
        console.error('Store search failed:', e);
    }
});

function selectStore(storename) {
    document.getElementById('store_input').value = storename;
    document.getElementById('store_value').value = storename;
    document.getElementById('store_dropdown').style.display = 'none';
    document.getElementById('product_input').disabled = false;
    updateSearchButton();
}

// 🔥 SEARCH
document.getElementById('historySearchForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const params = new URLSearchParams();
    for (let [key, value] of formData) {
        if (value.trim()) params.append(key, value.trim());
    }
    
    try {
        const response = await fetch(`/api/history-search?${params}`);
        const data = await response.json();
        
        document.getElementById('resultsCount').textContent = data.length || 0;
        
        if (data.error) {
            document.getElementById('resultsTable').innerHTML = 
                `<div class="alert alert-danger p-5 m-0"><h5>❌ ${data.error}</h5></div>`;
            return;
        }
        
        if (!data.length) {
            document.getElementById('resultsTable').innerHTML = 
                `<div class="p-5 text-center text-muted m-0"><h5>📭 No records found</h5></div>`;
            return;
        }
        
        let html = `
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr><th>Date</th><th>City</th><th>Store</th><th>Product</th><th>Stock</th><th>Sales</th><th>Status</th></tr>
                </thead>
                <tbody>
        `;
        data.forEach(row => {
            const statusClass = row.stock_status.includes('Low') ? 'text-danger' : 
                               row.stock_status.includes('Overstock') ? 'text-warning' : 'text-success';
            html += `
                <tr>
                    <td>${row.timestamp.split('T')[0]}</td>
                    <td><span class="badge bg-info">${row.cityname}</span></td>
                    <td>${row.storename}</td>
                    <td>${row.productname}</td>
                    <td><strong class="${statusClass}">${row.stock}</strong></td>
                    <td>${row.sale_amount || 0}</td>
                    <td><span class="badge ${statusClass === 'text-danger' ? 'bg-danger' : statusClass === 'text-warning' ? 'bg-warning text-dark' : 'bg-success'}">${row.stock_status}</span></td>
                </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('resultsTable').innerHTML = html;
    } catch(e) {
        console.error('Search failed:', e);
    }
});

function updateSearchButton() {
    const hasCity = document.getElementById('city_value').value;
    const hasStore = document.getElementById('store_value').value;
    document.getElementById('search_btn').disabled = !(hasCity && hasStore);
}

// Hide dropdowns on outside click
document.addEventListener('click', function(e) {
    if (!e.target.closest('.position-relative')) {
        document.querySelectorAll('[id$="_dropdown"]').forEach(d => d && (d.style.display = 'none'));
    }
});
</script>
{% endblock %}
